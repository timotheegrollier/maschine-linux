name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ALSA, udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate Desktop Entry
        run: desktop-file-validate packaging/maschine-linux.desktop

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check optional sampler-free engine
        run: cargo check -p maschine-engine --no-default-features

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release --verbose
