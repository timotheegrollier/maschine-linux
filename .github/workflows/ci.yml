name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ALSA, udev, JACK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libjack-jackd2-dev desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate Desktop Entry
        run: desktop-file-validate packaging/maschine-linux.desktop

      - name: Validate AppStream Metadata
        run: appstreamcli validate --no-net packaging/io.github.timotheegrollier.maschine-linux.metainfo.xml

      - name: Format
        run: cargo fmt --all -- --check

      - name: Validate release notes
        run: |
          version="$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)"
          ./scripts/extract-release-notes.sh "${version}" > /dev/null

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check optional sampler-free engine
        run: cargo check -p maschine-engine --no-default-features

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release --verbose

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ALSA, udev, JACK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libjack-jackd2-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check workspace on the declared MSRV
        run: cargo check --workspace --locked
