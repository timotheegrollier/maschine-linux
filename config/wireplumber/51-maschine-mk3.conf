# WirePlumber >=0.5 — fix channel map MK3 (bmChannelConfig=0 -> ALSA devine 4.0 Surround)
# Placer dans ~/.config/wireplumber/wireplumber.conf.d/51-maschine-mk3.conf
# Pour WirePlumber <=0.4 utiliser 51-maschine-mk3.lua (voir doc)
# Puis : systemctl --user restart wireplumber

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Native_Instruments_Maschine_MK3_*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
        device.profile = "pro-audio"
      }
    }
  }
]

# Alternative pour pro-audio : 4 ports discrets au lieu de Surround
# Vérifier : wpctl status | grep MK3 -> doit afficher "Pro Audio" pas "Surround 4.0"
