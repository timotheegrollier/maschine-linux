[package]
name = "maschine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binaire maschine-linux : daemon, CLI, probe, (future) GUI"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "maschine-linux"
path = "src/main.rs"

[dependencies]
maschine-proto = { workspace = true }
maschine-hardware = { workspace = true }
maschine-engine = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
ctrlc = "3.4"
cpal = { version = "0.15", optional = true }
rusb = { version = "0.9", optional = true }
libc = "0.2"

# GUI optionnelle
eframe = { version = "0.32", optional = true }
egui = { version = "0.32", optional = true }

[features]
default = ["audio", "usb", "midi-alsa", "gui"]
audio = ["dep:cpal"]
gui = ["dep:eframe", "dep:egui"]
usb = ["maschine-hardware/usb", "dep:rusb"]
midi-alsa = ["maschine-hardware/midi-alsa"]
full = ["audio", "usb", "gui"]

[dev-dependencies]
env_logger = { workspace = true }
