[package]
name = "maschine-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-time DSP effects for guitar (gate, drive, tonestack, cab, delay)"
categories = ["multimedia::audio", "dsp"]
keywords = ["dsp", "guitar", "effects", "real-time"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
atomic_float = "1.1"  # lock-free parameter smoothing
realfft = { version = "3.0", optional = true }  # IR convolution (Pi5+)
rustfft = { version = "6.0", optional = true }
hound = { version = "3.5", optional = true }    # WAV loading for IR

[features]
default = []
ir = ["realfft", "rustfft", "hound"]  # enable cab IR convolution (heavier)

[dev-dependencies]
criterion = "0.5"