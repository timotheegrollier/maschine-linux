[package]
name = "maschine-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domaine Maschine : Project/Group/Sound/Pattern/Scene/Section, Transport, Sequencer, Sampler"
keywords.workspace = true
categories.workspace = true

[dependencies]
maschine-proto = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
# Texte lissé des écrans MK3 : mêmes crates et polices que la GUI egui.
ab_glyph = "0.2"
epaint_default_fonts = "0.32"
# Formes lissées des écrans MK3 (courbes, arcs, coins arrondis, dégradés).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# sampler / audio utils
hound = { version = "3.5", optional = true }
cpal = { version = "0.15", optional = true }

[features]
default = ["sampler"]
sampler = ["dep:hound"]
audio = ["dep:cpal", "sampler"]

[dev-dependencies]
env_logger = { workspace = true }
