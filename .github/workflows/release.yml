name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-release:
    name: Build Multi-Distribution Packages & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libjack-jackd2-dev \
            desktop-file-utils \
            rpm \
            dpkg-dev \
            curl \
            imagemagick

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo packaging tools
        run: |
          cargo install cargo-generate-rpm --locked || true
          cargo install cargo-deb --locked || true

      - name: Verify tag matches workspace version
        run: |
          version="$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "error: tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          }

      - name: Build release binaries
        run: |
          cargo build --release --locked -p maschine-app

      - name: Validate Desktop Entry
        run: desktop-file-validate packaging/maschine-linux.desktop

      - name: Build Fedora / Nobara RPM Package
        run: |
          ./scripts/build-rpm.sh

      - name: Build Universal AppImage (All Linux distros)
        run: |
          ./scripts/build-appimage.sh

      - name: Build Debian / Ubuntu DEB Package
        run: |
          ./scripts/build-deb.sh

      - name: Package Universal Standalone Tarball & SHA-256 Checksums
        run: |
          ./scripts/package-release.sh

      - name: Verify generated packages in dist/
        run: |
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Extract English release notes
        run: |
          mkdir -p dist
          ./scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
