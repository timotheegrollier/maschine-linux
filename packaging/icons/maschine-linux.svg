<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="pad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffae00" />
    </linearGradient>
    <linearGradient id="pad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b122e6" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="pad-dim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3038" />
      <stop offset="100%" stop-color="#202228" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Chassis Body -->
  <rect x="24" y="24" width="464" height="464" rx="36" fill="url(#bg)" stroke="#323640" stroke-width="4" />

  <!-- Dual Displays -->
  <rect x="56" y="56" width="188" height="110" rx="10" fill="url(#screen-grad)" stroke="#222730" stroke-width="2" />
  <rect x="268" y="56" width="188" height="110" rx="10" fill="url(#screen-grad)" stroke="#222730" stroke-width="2" />

  <!-- Display Graphics (Audio Waveform & Sequencer grid) -->
  <path d="M 68 111 Q 90 85 110 111 T 150 111 T 190 80 T 230 111" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.85" />
  <rect x="282" y="72" width="22" height="16" rx="3" fill="#ff7b00" opacity="0.9" />
  <rect x="312" y="72" width="22" height="16" rx="3" fill="#323640" />
  <rect x="342" y="72" width="22" height="16" rx="3" fill="#00f2fe" opacity="0.9" />
  <rect x="372" y="72" width="22" height="16" rx="3" fill="#323640" />
  <rect x="402" y="72" width="22" height="16" rx="3" fill="#ff007f" opacity="0.9" />

  <!-- Display Knobs Line -->
  <circle cx="85" cy="188" r="8" fill="#383c48" stroke="#4facfe" stroke-width="2" />
  <circle cx="135" cy="188" r="8" fill="#383c48" stroke="#4facfe" stroke-width="2" />
  <circle cx="185" cy="188" r="8" fill="#383c48" stroke="#4facfe" stroke-width="2" />
  <circle cx="235" cy="188" r="8" fill="#383c48" />
  <circle cx="277" cy="188" r="8" fill="#383c48" stroke="#ff7b00" stroke-width="2" />
  <circle cx="327" cy="188" r="8" fill="#383c48" stroke="#ff7b00" stroke-width="2" />
  <circle cx="377" cy="188" r="8" fill="#383c48" />
  <circle cx="427" cy="188" r="8" fill="#383c48" stroke="#ff007f" stroke-width="2" />

  <!-- 4x4 Pad Grid (Pads 1..16) -->
  <!-- Row 1 (Top: Pads 13, 14, 15, 16) -->
  <rect x="68" y="224" width="58" height="58" rx="8" fill="url(#pad-purple)" filter="url(#glow)" />
  <rect x="138" y="224" width="58" height="58" rx="8" fill="url(#pad-purple)" />
  <rect x="208" y="224" width="58" height="58" rx="8" fill="url(#pad-dim)" />
  <rect x="278" y="224" width="58" height="58" rx="8" fill="url(#pad-dim)" />

  <!-- Row 2 (Pads 9, 10, 11, 12) -->
  <rect x="68" y="294" width="58" height="58" rx="8" fill="url(#pad-dim)" />
  <rect x="138" y="294" width="58" height="58" rx="8" fill="url(#pad-orange)" filter="url(#glow)" />
  <rect x="208" y="294" width="58" height="58" rx="8" fill="url(#pad-orange)" />
  <rect x="278" y="294" width="58" height="58" rx="8" fill="url(#pad-dim)" />

  <!-- Row 3 (Pads 5, 6, 7, 8) -->
  <rect x="68" y="364" width="58" height="58" rx="8" fill="url(#pad-dim)" />
  <rect x="138" y="364" width="58" height="58" rx="8" fill="url(#pad-dim)" />
  <rect x="208" y="364" width="58" height="58" rx="8" fill="url(#pad-cyan)" filter="url(#glow)" />
  <rect x="278" y="364" width="58" height="58" rx="8" fill="url(#pad-cyan)" />

  <!-- Row 4 (Bottom: Pads 1, 2, 3, 4) -->
  <rect x="68" y="434" width="58" height="42" rx="6" fill="url(#pad-cyan)" filter="url(#glow)" />
  <rect x="138" y="434" width="58" height="42" rx="6" fill="url(#pad-dim)" />
  <rect x="208" y="434" width="58" height="42" rx="6" fill="url(#pad-dim)" />
  <rect x="278" y="434" width="58" height="42" rx="6" fill="url(#pad-orange)" />

  <!-- Master Encoder / Wheel on the right -->
  <circle cx="396" cy="310" r="48" fill="#20232a" stroke="#444a56" stroke-width="4" />
  <circle cx="396" cy="310" r="34" fill="#181a20" stroke="#00f2fe" stroke-width="3" />
  <circle cx="396" cy="286" r="5" fill="#00f2fe" />

  <!-- Smart Strip representation below encoder -->
  <rect x="360" y="380" width="72" height="96" rx="8" fill="#15171d" stroke="#2a2e38" stroke-width="2" />
  <rect x="392" y="394" width="8" height="68" rx="4" fill="#00f2fe" opacity="0.75" />
</svg>
