# PipeWire low-latency pour Maschine MK3 — 128 frames @48kHz = 2.7ms
# Placer dans ~/.config/pipewire/pipewire.conf.d/99-maschine-lowlatency.conf
# ou /etc/pipewire/pipewire.conf.d/ (system-wide)
# Puis : systemctl --user restart pipewire pipewire-pulse wireplumber && pw-top

context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 128
    default.clock.min-quantum = 32
    default.clock.max-quantum = 8192
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}

# Optionnel : augmenter headroom si xruns
# context.properties = { ... , default.clock.headroom = 128 }

